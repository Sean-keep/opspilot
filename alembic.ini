# Alembic configuration.
#
# Migrations are run explicitly — never from application startup:
#   alembic upgrade head
#
# The database URL is resolved from OPSPILOT_* environment variables in
# migrations/env.py, so no credentials appear in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Template used to name new revision files.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally empty: env.py builds it from Settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
