# OpsPilot quickstart reverse proxy — OPTIONAL, local only.
#
# Serves the built frontend and forwards the API to the `api` container. This
# is the same split the Vite dev server does (see frontend/vite.config.ts):
# the browser only ever talks to one origin, so cookies and headers stay
# same-origin and the frontend never hard-codes a backend URL.
#
# Production puts its own TLS terminator here (README: "生产环境把
# OPSPILOT_API_HOST 留在 127.0.0.1，由 Nginx / Caddy 反代并终止 TLS").
# This file deliberately does not terminate TLS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; hashed asset filenames are safe to cache hard.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, health and readiness endpoints live on the backend. /healthz is
    # unauthenticated on purpose (a probe); /readyz is the one a proxy should
    # use to pull a backend out of rotation.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # SSE streams stay open
    }

    location = /healthz {
        proxy_pass http://api:8080;
    }

    location = /readyz {
        proxy_pass http://api:8080;
    }

    # SPA fallback: unknown paths are the frontend router's business.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
