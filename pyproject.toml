[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Self-hosted web console for multi-server Linux operations: install, deploy, manage, audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Dependency ranges are pinned to a compatible window and refreshed deliberately.
# The product runs under systemd on a plain host; no container runtime is
# required. `Dockerfile` / `docker-compose.yml` are only the optional local
# quickstart — see README "硬约束" and "5 分钟跑起来".
dependencies = [
  "fastapi>=0.115,<0.150",
  "uvicorn>=0.30,<0.60",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<2.3",
  "alembic>=1.13,<1.21",
  "pymysql>=1.1,<1.3",
  "cryptography>=43,<51",
  "paramiko>=3.4,<5.1",
  "structlog>=24,<27",
  "python-multipart>=0.0.9,<0.1",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<0.4",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<0.29",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-pyyaml>=6.0,<7",
  "types-paramiko>=3.4,<5",
]

[project.scripts]
opspilot-api = "backend.app.main:run"
opspilot-worker = "worker.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "backend*", "worker*"]

[tool.setuptools.package-data]
shared = ["py.typed"]
backend = ["py.typed"]
worker = ["py.typed"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests", "worker/tests", "shared/tests", "templates"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: needs a reachable MySQL (opspilot_test); skipped when unavailable",
  "remote: needs a reachable SSH test target; never run against production",
]
filterwarnings = ["error::DeprecationWarning:sqlalchemy.*"]

# --------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "worker", "shared"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "S",   # bandit — security
  "N",   # pep8-naming
  "RET",
  "SIM",
  "TID",
  "ARG",
  "PTH",
  "RUF",
]
ignore = [
  "S101",  # assert is required by the test suite
  "ARG002",
  # API error classes are deliberately named after their wire code
  # ("unauthenticated", "forbidden", "not_found" …) rather than with an
  # Error suffix. See backend/app/core/errors.py.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "ARG", "N802", "N803", "N806"]
"worker/tests/**" = ["S", "ARG", "N802", "N803", "N806"]
"shared/tests/**" = ["S", "ARG", "N802", "N803", "N806"]
"migrations/**" = ["E501"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
show_error_codes = true
packages = ["shared", "backend", "worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["paramiko.*", "pymysql.*", "alembic.*", "structlog.*", "pwdlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["backend.tests.*", "worker.tests.*", "shared.tests.*"]
disallow_untyped_defs = false
